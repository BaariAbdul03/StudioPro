<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Page not found — StudioPro</title>
  <style>
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f7f8fb; color: #161e32; font: 1rem/1.55 system-ui, sans-serif; }
    main { box-sizing: border-box; width: min(29rem, calc(100% - 2rem)); padding: clamp(1.25rem, 5vw, 2.5rem); border: 1px solid #d5dce7; border-radius: .75rem; background: white; }
    img { display: block; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); line-height: 1.1; margin: .35rem 0 .85rem; }
    p { color: #4b5670; margin: 0 0 1.5rem; }
    .code { margin: 1.3rem 0 .25rem; color: #2549cc; font-weight: 700; }
    a { display: inline-block; padding: .5rem .85rem; border-radius: .45rem; background: #2549cc; color: #fff; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" width="34" height="34" alt="StudioPro">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The address may have changed, or the page may have been removed.</p>
    <a href="/">Go home</a>
  </main>
</body>
</html>
